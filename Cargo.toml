[package]
name = "cc-telegram"
version = "0.1.0"
edition = "2024"
description = "Telegram bot that forwards messages to Claude Code (claude -p) on your own machine"
license = "MIT"
repository = "https://github.com/opencraftdev/cc-telegram"
homepage = "https://github.com/opencraftdev/cc-telegram"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
cron = "0.17.0"
dialoguer = "0.12.0"
dirs = "7.0.0"
indicatif = "0.18.6"
libc = "0.2.191"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
teloxide = { version = "0.17.0", default-features = false, features = ["macros", "rustls", "ctrlc_handler"] }
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
